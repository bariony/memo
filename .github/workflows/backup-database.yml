name: Database Backup

# Railway's Hobby plan can't create new backups or enable point-in-time
# recovery (that's Pro-only, $20/mo). This is the free alternative: a daily
# pg_dump stored as a GitHub Actions artifact, so a database incident
# doesn't mean losing all of Memo's users, expenses and reminders with zero
# way back. Not as fine-grained as real PITR (worst case you lose up to a
# day), but it's free and it's something.
#
# Requires one repo secret: DATABASE_URL (the same connection string the
# app itself uses - copy it from Railway's "memo" service variables into
# this repo's Settings > Secrets and variables > Actions > New repository
# secret).

on:
  schedule:
    - cron: '0 7 * * *' # 04:00 America/Sao_Paulo daily
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
        # If this fails with a server/client version mismatch against
        # Railway's Postgres, pin a specific version here instead, e.g.
        # `postgresql-client-17`, matching the server's major version.

      - name: Dump database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -e
          mkdir -p backup
          DATE=$(date -u +'%Y-%m-%d')
          pg_dump "$DATABASE_URL" --no-owner --no-acl -F c -f "backup/memo-${DATE}.dump"

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: memo-db-backup-${{ github.run_id }}
          path: backup/*.dump
          retention-days: 14
