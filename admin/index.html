<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memo • Gerenciador de Usuários</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="login-section" class="login-wrapper">
    <div class="login-container">
      <div class="login-header">
        <div class="logo">Memo</div>
        <p>Painel de Administração</p>
      </div>

      <form onsubmit="event.preventDefault(); login();">
        <input type="password" id="password" placeholder="Senha de acesso" required>
        <button type="submit">Acessar</button>
      </form>
    </div>
  </div>

  <div id="dashboard-section" class="dashboard hidden">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="logo">Memo</div>
      </div>

      <nav class="nav-menu">
        <a href="#" class="nav-item active">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="12 3 20 7.5 20 16.5 12 21 4 16.5 4 7.5 12 3"></polyline>
          </svg>
          Dashboard
        </a>
        <a href="#" class="nav-item">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
          Usuários
        </a>
      </nav>

      <div class="sidebar-footer">
        <button onclick="logout()" class="logout-link">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
          Sair
        </button>
      </div>
    </aside>

    <main class="dashboard-content">
      <header class="dashboard-header">
        <h1>Dashboard</h1>
        <div class="header-actions">
          <span class="user-info">Admin</span>
        </div>
      </header>

      <div class="dashboard-body">
        <section class="stats-grid">
          <div class="stat-card">
            <div class="stat-icon users">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
            </div>
            <div class="stat-info">
              <p class="stat-label">Usuários Ativos</p>
              <p class="stat-value" id="active-users">-</p>
            </div>
          </div>

          <div class="stat-card">
            <div class="stat-icon expenses">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="1"></circle>
                <path d="M12 1v6m0 6v6"></path>
                <path d="M4.22 4.22l4.24 4.24m5.08 0l4.24-4.24"></path>
                <path d="M1 12h6m6 0h6"></path>
                <path d="M4.22 19.78l4.24-4.24m5.08 0l4.24 4.24"></path>
              </svg>
            </div>
            <div class="stat-info">
              <p class="stat-label">Gastos Registrados</p>
              <p class="stat-value" id="total-expenses">-</p>
            </div>
          </div>
        </section>

        <section class="form-card">
          <div class="card-header">
            <h2>Novo Usuário</h2>
            <p>Adicione um novo usuário ao sistema</p>
          </div>

          <form class="form-grid" onsubmit="event.preventDefault(); addUser();">
            <input type="text" id="new-phone" placeholder="Número WhatsApp (11 999999999)" required>
            <input type="date" id="new-expiry" required>
            <button type="submit" class="btn-primary">Adicionar</button>
          </form>
        </section>

        <section class="table-card">
          <div class="card-header">
            <h2>Usuários</h2>
            <p>Gerencie os usuários do sistema</p>
          </div>

          <table class="data-table">
            <thead>
              <tr>
                <th>Número</th>
                <th>Válido até</th>
                <th>Status</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody id="whitelist-body"></tbody>
          </table>
        </section>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
